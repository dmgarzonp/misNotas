<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Warm Pastel Honey Gradient -->
    <linearGradient id="note-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>

    <!-- Pin Metallic Gradient -->
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>

    <!-- Pencil Body Gradient -->
    <linearGradient id="pencil-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D96FF"/>
      <stop offset="100%" stop-color="#1967D2"/>
    </linearGradient>
  </defs>

  <!-- Note Card Container with Shadow -->
  <rect x="48" y="48" width="416" height="416" rx="56" ry="56" fill="url(#note-bg)" filter="url(#drop-shadow)" stroke="#E6C200" stroke-width="4"/>

  <!-- Horizontal Ruled Lines -->
  <line x1="96" y1="170" x2="416" y2="170" stroke="rgba(0,0,0,0.08)" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="230" x2="416" y2="230" stroke="rgba(0,0,0,0.08)" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="290" x2="416" y2="290" stroke="rgba(0,0,0,0.08)" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="350" x2="350" y2="350" stroke="rgba(0,0,0,0.08)" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Red Margin Line -->
  <line x1="140" y1="90" x2="140" y2="420" stroke="rgba(255, 99, 71, 0.35)" stroke-width="4" stroke-linecap="round"/>

  <!-- Red Pushpin at Top Right -->
  <g transform="translate(380, 80)">
    <circle cx="0" cy="0" r="18" fill="url(#pin-grad)" filter="url(#drop-shadow)"/>
    <circle cx="-4" cy="-4" r="6" fill="#FFA8A8" opacity="0.6"/>
  </g>

  <!-- Stylized Pencil Symbol in Foreground -->
  <g transform="translate(290, 240) rotate(-45)">
    <!-- Pencil Body -->
    <rect x="-16" y="-70" width="32" height="110" rx="6" fill="url(#pencil-body)"/>
    <!-- Eraser -->
    <rect x="-16" y="-90" width="32" height="20" rx="4" fill="#FF8E8E"/>
    <!-- Metal Band -->
    <rect x="-16" y="-72" width="32" height="6" fill="#D1D5DB"/>
    <!-- Pencil Tip -->
    <polygon points="-16,40 16,40 0,75" fill="#F3D2A2"/>
    <!-- Lead Tip -->
    <polygon points="-6,62 6,62 0,75" fill="#2C3E50"/>
  </g>
</svg>
